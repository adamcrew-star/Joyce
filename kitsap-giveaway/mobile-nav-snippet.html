<!-- ============================================================= -->
<!-- Kitsap Roof Pros - Mobile header layout                       -->
<!-- Moves the floating bottom Menu + phone controls into the      -->
<!-- header so mobile reads: Menu (left) - centered logo -         -->
<!-- phone (right). Paste as an HTML snippet (Site Wide Header).    -->
<!-- Scoped to <=991px so desktop is untouched.                    -->
<!-- ============================================================= -->
<style id="krp-mobile-nav-css">
@media (max-width: 991.98px){
  header.site-header .site-header__inner{ position: relative !important; }

  /* Menu pinned left, phone pinned right; logo stays centered. */
  header.site-header .site-header__inner > .menu-toggle{
    position: absolute !important;
    left: 12px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    margin: 0 !important;
    z-index: 5 !important;
  }
  header.site-header .site-header__inner > a[href^="tel"]{
    position: absolute !important;
    right: 12px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    margin: 0 !important;
    z-index: 5 !important;
  }

  /* Keep the centered logo compact so it never collides with the sides. */
  header.site-header .site-header__inner .site-header__branding img{
    max-width: 132px !important;
    height: auto !important;
  }

  /* Recolor menu + phone so they read on the white header. */
  header.site-header .site-header__inner .menu-toggle,
  header.site-header .site-header__inner .menu-toggle *,
  header.site-header .site-header__inner a[href^="tel"],
  header.site-header .site-header__inner a[href^="tel"] *{
    color: #1c7a3f !important;
  }
  header.site-header .site-header__inner a[href^="tel"]{
    background: transparent !important;
    box-shadow: none !important;
    padding: 0 !important;
    font-size: 13px !important;
    line-height: 1.1 !important;
    white-space: nowrap !important;
    gap: 6px !important;
  }
  header.site-header .site-header__inner a[href^="tel"] picture,
  header.site-header .site-header__inner a[href^="tel"] img{
    width: 26px !important;
    height: 26px !important;
  }
  header.site-header .site-header__inner .menu-toggle{
    background: transparent !important;
    box-shadow: none !important;
  }
  header.site-header .site-header__inner .hamburger__line,
  header.site-header .site-header__inner .menu-toggle span{
    background: #1c7a3f !important;
  }

  /* Remove the now-empty floating bottom bar. */
  header.site-header + div{ display: none !important; }
}

/* Desktop keeps its own nav; hide the relocated mobile controls. */
@media (min-width: 992px){
  header.site-header .site-header__inner > .menu-toggle,
  header.site-header .site-header__inner > a[href^="tel"]{ display: none !important; }
}
</style>
<script>
(function(){
  function init(){
    var header = document.querySelector('header.site-header, #masthead');
    if(!header) return;
    var inner = header.querySelector('.site-header__inner') || header;
    var bar = header.nextElementSibling;
    if(!bar) return;

    var menuBtn = bar.querySelector('.menu-toggle') || bar.querySelector('button');
    var phone = bar.querySelector('a[href^="tel"]');

    // Relocate the mobile controls into the header row (once).
    if(menuBtn && menuBtn.parentElement !== inner){ inner.insertBefore(menuBtn, inner.firstChild); }
    if(phone && phone.parentElement !== inner){ inner.appendChild(phone); }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
