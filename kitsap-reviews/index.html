<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b3b">
  <meta name="description" content="Share feedback about your experience with Kitsap Roof Pros.">
  <title>Share Your Experience | Kitsap Roof Pros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="roof-lines" aria-hidden="true"></div>

    <main class="review-card">
      <header class="brand">
        <a href="https://kitsaproofpros.com/" target="_blank" rel="noopener noreferrer" aria-label="Visit Kitsap Roof Pros">
          <img src="logo.svg" alt="Kitsap Roof Pros">
        </a>
      </header>

      <section id="rating-step" class="step">
        <div class="eyebrow">We value your feedback</div>
        <h1>How was your experience with Kitsap Roof Pros?</h1>
        <p class="intro">Your feedback helps our local team keep raising the roof on great service.</p>

        <div class="rating-grid" role="group" aria-label="Choose your experience rating">
          <button class="rating-option" type="button" data-rating="Excellent">
            <span class="emoji-wrap"><span class="emoji" aria-hidden="true">😄</span></span>
            <span class="rating-label">Excellent</span>
          </button>
          <button class="rating-option" type="button" data-rating="Good">
            <span class="emoji-wrap"><span class="emoji" aria-hidden="true">🙂</span></span>
            <span class="rating-label">Good</span>
          </button>
          <button class="rating-option" type="button" data-rating="Okay">
            <span class="emoji-wrap"><span class="emoji" aria-hidden="true">😐</span></span>
            <span class="rating-label">Okay</span>
          </button>
          <button class="rating-option" type="button" data-rating="Not great">
            <span class="emoji-wrap"><span class="emoji" aria-hidden="true">🙁</span></span>
            <span class="rating-label">Not great</span>
          </button>
        </div>

        <p class="privacy-note">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M5 12h14m-5-5 5 5-5 5"/>
          </svg>
          You’ll continue to Google to select your stars and write your review.
        </p>
        <p id="redirect-status" class="redirect-status" aria-live="polite"></p>
      </section>

      <footer>
        <span>Locally owned and serving Kitsap County</span>
        <span class="footer-separator" aria-hidden="true">•</span>
        <a href="tel:+13609190732">(360) 919-0732</a>
        <span class="footer-separator" aria-hidden="true">•</span>
        <a href="https://kitsaproofpros.com/" target="_blank" rel="noopener noreferrer">kitsaproofpros.com</a>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
